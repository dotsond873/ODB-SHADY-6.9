[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odb-shady"
version = "0.1.0"
description = "An independent, modular personal AI assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
# Pillow is only needed for the optional Local Dream image backend.
local-image = ["Pillow>=11,<13"]
dev = ["pytest>=8.0", "Pillow>=11,<13"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
